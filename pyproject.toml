[project]
name = "ebola-bdbv-data"
version = "0.1.0"
description = "Extraction of the 2026 DRC Bundibugyo virus outbreak situation reports"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "snakemake>=8.0",
    "pyyaml>=6.0.3",
    "pdfplumber>=0.11",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
