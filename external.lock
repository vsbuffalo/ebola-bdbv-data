# Pins for the two comparison sources -- renderings of the same INSP reports
# that we check our extraction AGAINST, never build FROM.
#   BDBV2026-Data    INRB-UMIE's transcription, cloned into external/ (gitignored)
#                    by `make external` at exactly this commit; `make
#                    external-update` moves the pin to their head.
#   BVDOutbreakSize  the epiforecasts scan; `make scan-refresh` downloads
#                    data/insp_sitrep_scanned.csv at exactly this commit into the
#                    committed copy data/raw/scan/; `make scan-update` moves the pin.
# Each update rewrites only its own row, and the diff is the record of what
# upstream changed.
